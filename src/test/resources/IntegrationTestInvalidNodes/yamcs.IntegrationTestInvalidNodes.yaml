services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.archive.CcsdsTmIndex
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
  - class: org.yamcs.ProcessorCreatorService
    args: 
      name: "realtime"
      type: "realtime"
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.parameter.SystemParametersCollector

dataLinks:
  - name: tm_realtime
    class: com.windhoverlabs.yamcs.opcua.test.AbstractOPCUAIntegrationInvalidNodesTest$PacketProvider
    num: 0
    stream: tm_realtime
  - name: tm2_realtime
    class: com.windhoverlabs.yamcs.opcua.test.AbstractOPCUAIntegrationInvalidNodesTest$PacketProvider
    num: 1
    stream: tm2_realtime
            
  - name: pp_realtime
    class: com.windhoverlabs.yamcs.opcua.test.AbstractOPCUAIntegrationInvalidNodesTest$ParameterProvider
    stream: pp_realtime
    num: 0
  - name: tc_realtime
    class: com.windhoverlabs.yamcs.opcua.test.AbstractOPCUAIntegrationInvalidNodesTest$TcDataLink
    num: 0
    stream: tc_realtime
 
 
  - name: tm_ocpua
    class: com.windhoverlabs.yamcs.opcua.OPCUALink
    opcuaStream: "opcua_params"
    xtceOutputFile: opcua_xtce.xml
    endpointUrl: "opc.tcp://localhost:12689/milo"
    discoveryUrl: "opc.tcp://localhost:12689/milo/discovery"
    parametersNamespace: "/instruments/tvac"
    queryAllNodesAtStartup: false # defaults to false
    publishInterval: 100
    enabledAtStartup: true
    
    # i 	Numeric (UInteger)
    # s 	String (String)
    # g 	Guid (Guid)
    # b 	Opaque (ByteString)

    nodePaths:
      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:Boolean"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:Double"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:Int32"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:UInt32"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:Float"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root


      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:Int64"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:UInt64"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:String"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root

      - path: "0:Objects,2:HelloWorld,2:Dynamic,2:InvalidNode"
        rootNodeID: #Link starts browsing at this node
          namespaceIndex: 0
          identifierType: Numeric
          identifier: "84"  #84 is Root


mdb:
    - type: "xtce"
      spec: "mdb/cfs-ccsds.xml"


streamConfig:
  tm: 
   - name: tm_realtime
     processor: realtime
   - name: tm2_realtime
     processor: realtime
   - name: tm_dump
  cmdHist: ["cmdhist_realtime",  "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["sys_param", "pp_realtime", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  eventAlarm: ["event_alarms_realtime"]
  tc: 
    - name: "tc_realtime"
      processor: realtime
